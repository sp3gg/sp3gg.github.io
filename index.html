<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Spegg</title>

  <style>

    /* ==============================
       BASIC RESET
    ============================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #ffffff;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      padding: 50px 20px;

      background-color: #03050d;

      overflow-x: hidden;
    }


    /* ==============================
       STATIC STARFIELD

       No animation.
       No JavaScript.
       No giant moving layers.
    ============================== */

    .starfield {
      position: fixed;
      inset: 0;

      pointer-events: none;

      z-index: 0;

      background-color: #03050d;

      background-image:

        radial-gradient(
          circle at 10% 20%,
          rgba(255,255,255,0.9) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle at 25% 70%,
          rgba(255,255,255,0.65) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle at 40% 35%,
          rgba(255,255,255,0.8) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle at 55% 80%,
          rgba(255,255,255,0.5) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle at 70% 25%,
          rgba(255,255,255,0.85) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle at 85% 65%,
          rgba(255,255,255,0.7) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle at 93% 15%,
          rgba(255,255,255,0.55) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle at 15% 90%,
          rgba(255,255,255,0.6) 0 1px,
          transparent 1.5px
        );

      background-size:
        330px 330px,
        410px 410px,
        500px 500px,
        370px 370px,
        460px 460px,
        520px 520px,
        390px 390px,
        480px 480px;
    }


    /* ==============================
       SUBTLE SPACE GLOW

       Static gradients only.
    ============================== */

    .space-glow {
      position: fixed;
      inset: 0;

      pointer-events: none;

      z-index: 1;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(72, 97, 160, 0.18),
          transparent 45%
        ),

        radial-gradient(
          circle at 15% 80%,
          rgba(74, 56, 125, 0.10),
          transparent 35%
        );
    }


    /* ==============================
       MAIN GLASS PANEL

       IMPORTANT:
       No backdrop-filter here.

       The translucent gradients,
       border and shadows create
       the glass appearance instead.
    ============================== */

    .page {
      position: relative;

      z-index: 2;

      width: 100%;
      max-width: 1000px;

      min-height: 700px;

      overflow: hidden;

      border-radius: 28px;

      border:
        1px solid
        rgba(255,255,255,0.18);

      background:
        linear-gradient(
          145deg,
          rgba(34, 41, 63, 0.88),
          rgba(14, 18, 31, 0.82)
        );

      box-shadow:
        0 20px 50px
        rgba(0,0,0,0.42),

        0 0 35px
        rgba(125,150,210,0.08),

        inset 0 1px 0
        rgba(255,255,255,0.16);
    }


    /* ==============================
       FAKE GLASS REFLECTION
    ============================== */

    .page::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 220px;

      pointer-events: none;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.055),
          transparent
        );
    }


    /* tiny edge highlight */

    .page::after {
      content: "";

      position: absolute;

      inset: 1px;

      border-radius: 27px;

      pointer-events: none;

      border:
        1px solid
        rgba(255,255,255,0.025);
    }


    /* ==============================
       NAVIGATION
    ============================== */

    nav {
      position: relative;

      z-index: 2;

      height: 75px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 35px;

      border-bottom:
        1px solid
        rgba(255,255,255,0.08);
    }


    .logo {
      font-size: 18px;

      font-weight: 600;

      letter-spacing: 2px;
    }


    .nav-links {
      display: flex;

      gap: 25px;
    }


    .nav-links a {
      color:
        rgba(255,255,255,0.60);

      text-decoration: none;

      font-size: 14px;

      transition:
        color 0.15s ease;
    }


    .nav-links a:hover {
      color: #ffffff;
    }


    /* ==============================
       HERO
    ============================== */

    .hero {
      position: relative;

      z-index: 2;

      min-height: 500px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 60px 30px;
    }


    .hero h1 {
      margin:
        0 0 20px;

      font-size:
        clamp(
          40px,
          8vw,
          80px
        );

      font-weight: 500;

      letter-spacing:
        -3px;
    }


    .hero p {
      margin: 0;

      max-width:
        600px;

      color:
        rgba(255,255,255,0.60);

      font-size:
        16px;

      line-height:
        1.8;
    }


    /* ==============================
       SMALL GLASS CARD

       Also no blur.
    ============================== */

    .small-card {
      margin-top:
        35px;

      padding:
        16px 24px;

      border-radius:
        16px;

      border:
        1px solid
        rgba(255,255,255,0.12);

      background:
        rgba(255,255,255,0.055);

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.08);

      color:
        rgba(255,255,255,0.72);

      font-size:
        14px;
    }


    /* ==============================
       FOOTER
    ============================== */

    footer {
      position: relative;

      z-index: 2;

      padding:
        22px;

      text-align:
        center;

      color:
        rgba(255,255,255,0.30);

      font-size:
        12px;

      border-top:
        1px solid
        rgba(255,255,255,0.07);
    }


    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 700px) {

      body {
        padding:
          20px 12px;
      }

      .page {
        border-radius:
          20px;
      }

      nav {
        padding:
          0 20px;
      }

      .nav-links {
        gap:
          15px;
      }

      .nav-links a {
        font-size:
          12px;
      }

      .hero {
        padding:
          40px 20px;
      }

    }

  </style>
</head>


<body>

  <div class="starfield"></div>
  <div class="space-glow"></div>


  <main class="page">

    <nav>

      <div class="logo">
        SPEGG
      </div>

      <div class="nav-links">

        <a href="#">
          Home
        </a>

        <a href="#">
          About
        </a>

        <a href="#">
          Stuff
        </a>

      </div>

    </nav>


    <section class="hero">

      <h1>
        hello.
      </h1>

      <p>
        Welcome to my little corner of the internet.
        This site is still under construction,
        so things may appear here without warning.
      </p>


      <div class="small-card">
        ✦ floating somewhere in cyberspace ✦
      </div>

    </section>


    <footer>
      © Spegg 2026
    </footer>

  </main>

</body>
</html>
