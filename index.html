        * {

            left: 0;
            right: 0;
            bottom: 0;

            border-radius: 34px;

        .slider:before {
            position: absolute;

            left: 4px;

            transition: .4s;

    <!-- Starfield Background -->
    <div class="star-field" id="starField"></div>

    <div class="center-panel">

    <script>
        // Create starfield background
        function createStarfield() {
            const starField = document.getElementById('starField');
            const starCount = 200;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // Random position
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                
                // Random size
                const size = Math.random() * 3;
                
                // Random animation duration
                const duration = 2 + Math.random() * 8;
                
                star.style.left = `${x}%`;
                star.style.top = `${y}%`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.setProperty('--duration', `${duration}s`);
                
                starField.appendChild(star);
            }
        }

        // Update time display
        function updateRaleighClock() {
            const now = new Date();
            const options = { 
                timeZone: 'America/New_York',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            
            const timeString = now.toLocaleTimeString('en-US', options);
            document.getElementById('timeDisplay').textContent = timeString;
        }

        // Update weather display
        async function updateWeather() {
            try {
                const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=35.78&longitude=-78.64&current_weather=true&temperature_unit=fahrenheit");
                if (!res.ok) throw new Error('Network response was not ok');
                const data = await res.json();
                
                const temperature = data.current_weather.temperature;
                const weatherCode = data.current_weather.weather_code;
                
                // Map weather codes to emojis (simplified)
                let emoji = '🌤️';
                if (weatherCode >= 50 && weatherCode <= 99) emoji = '🌧️';
                else if (weatherCode >= 300 && weatherCode <= 399) emoji = '⛈️';
                else if (weatherCode >= 100 && weatherCode <= 199) emoji = '☁️';
                
                document.getElementById('weather').innerHTML = `${emoji} ${temperature}°F`;
            } catch (error) {
                console.error("Failed to fetch weather:", error);
                document.getElementById('weather').textContent = "🌡️ Weather unavailable";
            }
        }

        // Get moon phase index
        function getMoonPhaseIndex() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            
            // Simplified moon phase calculation (approximate)
            const c = (year - 2000) * 365.25;
            const d = c + (month - 1) * 30 + day;
            const phase = (d % 29.53) / 29.53;
            
            // Convert to emoji index
            if (phase < 0.125 || phase > 0.875) return 0; // New Moon
            if (phase < 0.25) return 1; // Waxing Crescent
            if (phase < 0.375) return 2; // First Quarter
            if (phase < 0.5) return 3; // Waxing Gibbous
            if (phase < 0.625) return 4; // Full Moon
            if (phase < 0.75) return 5; // Waning Gibbous
            if (phase < 0.875) return 6; // Last Quarter
            return 7; // Waning Crescent
        }

        // Update moon phase display
        function updateMoonPhase() {
            const moonPhases = ['🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗', '🌘'];
            const index = getMoonPhaseIndex();
            document.getElementById('moonPhase').textContent = moonPhases[index];
        }

        // Create album widgets
        function createAlbumWidgets() {
            const albums = [
                { title: "When the Lights Go Out", cover: "when the lights go out cover.jpg" },
                { title: "Bloom", cover: "bloom cover.jpg" },
                { title: "The Night We Met", cover: "the night we met cover.jpg" },
                { title: "Crimson", cover: "crimson cover.jpg" },
                { title: "Midnight City", cover: "midnight city cover.jpg" },
                { title: "Echoes", cover: "echoes cover.jpg" },
                { title: "Starlight", cover: "starlight cover.jpg" },
                { title: "Velvet", cover: "velvet cover.jpg" }
            ];
            
            const container = document.getElementById('albumContainer');
            
            // Create 3 copies for seamless looping
            for (let i = 0; i < 3; i++) {
                albums.forEach(album => {
                    const widget = document.createElement('div');
                    widget.className = 'album-widget';
                    widget.innerHTML = `
                        <img src="${album.cover}" alt="${album.title} Album Cover">
                    `;
                    container.appendChild(widget);
                });
            }
        }

        // Toggle sun/moon mode
        function toggleSunMoon() {
            const sunMoonToggle = document.getElementById('sunMoonToggle');
            const toggleLabel = document.getElementById('toggleLabel');
            const body = document.body;
            
            if (sunMoonToggle.checked) {
                body.style.background = 'linear-gradient(135deg, #87CEEB, #E0F7FA)';
                toggleLabel.textContent = '🌙 Night Mode';
            } else {
                body.style.background = 'linear-gradient(135deg, #0f0c29, #302b63, #24243e)';
                toggleLabel.textContent = '☀️ Day Mode';
            }
        }

        // Initialize everything
        function init() {
            createStarfield();
            updateRaleighClock();
            updateWeather();
            updateMoonPhase();
            createAlbumWidgets();
            
            // Set up intervals
            setInterval(updateRaleighClock, 1000);
            setInterval(updateWeather, 300000); // Update weather every 5 minutes
            setInterval(updateMoonPhase, 3600000); // Update moon phase every hour
            
            // Set up toggle event listener
            document.getElementById('sunMoonToggle').addEventListener('change', toggleSunMoon);
        }

        // Start the page
        window.onload = init;
    </script>
</body>
